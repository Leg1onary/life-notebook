version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: lifenotebook
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lifenotebook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # порт наружу не нужен — db доступна только внутри docker сети
    # ports:
    #   - "5432:5432"

  api:
    build: ./api
    restart: always
    depends_on:
      - db
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://lifenotebook:secret@db:5432/lifenotebook
    # порт наружу не нужен — nginx проксирует напрямую
    # ports:
    #   - "8000:8000"
    networks:
      - default
      - nginxforge_net

networks:
  nginxforge_net:
    external: true
    name: nginxforge_nginxforge_net

volumes:
  postgres_data:
